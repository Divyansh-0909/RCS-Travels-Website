<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RCS live UI review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#15151d;font:14px/1.5 system-ui}header{padding:12px 20px;border-bottom:1px solid #c8cbd5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}button,select,a{font:inherit}button,select{padding:8px 10px;min-height:40px;cursor:pointer}button{border:1px solid #b2b5c0;border-radius:6px;background:transparent;color:inherit}button[aria-pressed=true],button[aria-current=true]{background:#243afb;color:white;border-color:#243afb}label{display:flex;gap:6px;align-items:center}a{color:#243afb}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 130px);min-height:600px}.preview{overflow:auto;background:#dfe2ea;display:flex;flex-direction:column;align-items:safe center;padding:12px;min-width:0}#frame-label{margin:0 0 8px;align-self:flex-start;color:#303342}iframe{border:0;background:white;width:390px;height:100%;min-height:650px;flex:none}aside{padding:20px;overflow:auto;border-left:1px solid #c8cbd5;min-width:0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px;color:#505464}p{margin:0 0 12px;overflow-wrap:anywhere}small{color:#505464}code{font-size:12px;overflow-wrap:anywhere}#queue{display:grid;gap:8px}#queue button{text-align:left;width:100%}.modes{display:flex;gap:4px}#measurement{white-space:pre-line}#status{font-weight:700}#safe-action{padding:8px;background:#e4e9ff}#safe-action:empty{display:none}:focus-visible{outline:3px solid #243afb;outline-offset:3px}[hidden]{display:none!important}@media(max-width:1000px){main{grid-template-columns:1fr;height:auto}.preview{height:72vh;min-height:500px}iframe{min-height:0}aside{border-left:0;border-top:1px solid #c8cbd5}header{padding:12px}h1{width:100%}}@media(prefers-color-scheme:dark){body{background:#121220;color:#eee}aside,header{border-color:#55586b}h2,small{color:#bdc0cf}a{color:#a0b1ff}#safe-action{background:#262636}}
</style><link rel="stylesheet" href="/consistency.css"></head><body class="review-shell">
<header><h1>RCS · Live UI review</h1><nav class="review-dock" aria-label="Preview tools"><div class="modes" role="group" aria-label="Preview mode"><button id="website" aria-pressed="true">Website</button><button id="android" aria-pressed="false">Android</button></div><div class="dock-preview-tools" role="group" aria-label="Screen and appearance"><div id="dock-screen"></div><button id="dock-theme" type="button" aria-label="Dark mode" aria-pressed="true"></button></div></nav><a id="open" target="_blank" rel="noreferrer">Open actual page</a></header>
<section id="website-controls" aria-label="Website preview controls"><label>Page <select id="page"><option value="/">Home / Landing</option><option value="/outstation">Outstation</option></select></label></section>
<div class="review-source-controls" hidden><select id="width" aria-label="Screen size"><option value="360">Phone · 360 px</option><option value="390" selected>Phone · 390 px</option><option value="768">Tablet · 768 px</option><option value="1280">Laptop · 1280 px</option><option value="1440">Laptop · 1440 px</option><option value="1920">Desktop · 1920 px</option></select><select id="theme" aria-label="Preview colour mode" data-review-theme><option value="dark">Dark</option><option value="light">Light</option></select></div>
<main><section class="preview" aria-label="Actual local preview"><p id="frame-label">Actual website · synthetic fixture · HMR</p><div id="site-stage"><iframe id="site" title="Actual RCS website with hot reload"></iframe></div></section>
<aside>
<div class="review-inspector-heading"><h1 id="screen">Select an issue</h1><p id="review-state"></p></div>
<div class="review-inspector-content">
<p id="safe-action" role="status"></p>
<details id="review-issues" class="review-accordion"><summary id="queue-title">Issues</summary><div id="queue"></div></details>
<details id="coverage-browser" class="review-accordion"><summary>Coverage</summary><label for="coverage-search">Find a screen</label><input id="coverage-search" type="search" placeholder="Settings, booking…" style="width:100%;padding:8px;min-height:40px"><label for="coverage-filter">Filter</label><select id="coverage-filter" style="width:100%"><option value="all">All entries</option><option value="NOT_REVIEWED">Not reviewed</option><option value="AUDITED">Audited by dimension</option><option value="VERIFIED">Verified checks</option><option value="OWNER_DEFERRED">Owner deferred</option><option value="NOT_RUN">Verification not run</option><option value="unavailable">Unavailable preview</option></select><p id="coverage-count" role="status"></p><div id="coverage-list" aria-label="Coverage entries" style="display:grid;gap:4px;max-height:320px;overflow:auto"></div></details>
<details class="review-accordion"><summary>Details</summary><p id="issue"></p><p><code id="selector"></code></p><p id="measurement"></p><h2>Treatment</h2><ul id="options"></ul><p id="decision"></p></details>
<details class="review-accordion"><summary>Activity</summary><p id="status">Preparing review…</p><small id="heartbeat"></small><p id="doing"></p><p id="connection"></p><small id="stamp"></small></details>
<p id="native-help" hidden>View only. Use the connected phone.</p>
</div>
<div class="review-inspector-footer"><button id="locate">Locate</button></div>
</aside></main>
<script>const consistencyLink=document.createElement('a');consistencyLink.id='consistency';consistencyLink.href='/?view=consistency';consistencyLink.textContent='Compare';document.querySelector('.modes').append(consistencyLink);document.getElementById('website').textContent='Website';document.getElementById('android').textContent='Android';</script>
<script type="module" src="/review-controls.js"></script><script src="/viewer.js"></script></body></html>
